# ros2_controllers_sim.yaml
# Controller configuration for MuJoCo simulation.
# Differences from the real-hardware config (ros2_controllers.yaml):
#   - open_loop_control: false  → controller uses actual joint-position feedback
#   - Slightly relaxed trajectory tolerances to account for sim dynamics
#   - Same controller types and joint lists as the real-hardware stack so that
#     MoveIt, Servo and other nodes remain unchanged.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — must match n_substeps * MJCF timestep (5 × 0.002 = 0.01 s)

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Use feedback so the trajectory controller corrects for sim dynamics.
    # With open_loop_control: true the controller ignores joint-state feedback,
    # which works on the real robot but can drift in simulation.
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      # Tolerances relaxed slightly to accommodate sim physics settling
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      goal: 0.05
      trajectory: 0.1

gripper_controller:
  ros__parameters:
    joint: joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    goal_tolerance: 0.02
    max_effort: 0.0
    allow_stalling: false
